name: Compiler l'APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compiler l'APK
        run: |
          set -o pipefail
          gradle --no-daemon assembleDebug 2>&1 | tee build.log

      - name: Publier le journal d'erreur
        if: failure()
        run: |
          tail -n 250 build.log > /tmp/log.txt || true
          git config user.name ci
          git config user.email ci@users.noreply.github.com
          git checkout --orphan build-log
          git rm -rf . > /dev/null 2>&1 || true
          cp /tmp/log.txt build-log.txt
          git add build-log.txt
          git commit -m "journal de compilation"
          git push -f origin build-log

      - name: Renommer l'APK
        run: cp app/build/outputs/apk/debug/app-debug.apk boussole-qibla.apk

      - uses: actions/upload-artifact@v4
        with:
          name: boussole-qibla-apk
          path: boussole-qibla.apk

      - name: Publier l'APK dans les Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Boussole Qibla (build ${{ github.run_number }})
          files: boussole-qibla.apk
          make_latest: true
