<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0E6B57"><style>:root{color-scheme:light;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style></head><body>
<title>Boussole Qibla</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Amiri:wght@700&display=swap" rel="stylesheet">
<style>
/* Layout: one narrow column. Dial first, then the bearing readout, two clocks, and location controls. */
:root {
  --bg: #EBEFED;
  --surface: #F8FAF9;
  --ink: #12201B;
  --muted: #58695F;
  --line: #C9D3CE;
  --accent: #0E6B57;
  --accent-ink: #FFFFFF;
  --qibla: #B4781A;
  --ok: #1B7F4B;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-num: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --font-ar: "Amiri", "Noto Naskh Arabic", "Geeza Pro", "Times New Roman", serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0D1512;
    --surface: #15211D;
    --ink: #E4EEE9;
    --muted: #8CA197;
    --line: #27382F;
    --accent: #4DBF9D;
    --accent-ink: #06130E;
    --qibla: #E3A93F;
    --ok: #55D08E;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0D1512;
  --surface: #15211D;
  --ink: #E4EEE9;
  --muted: #8CA197;
  --line: #27382F;
  --accent: #4DBF9D;
  --accent-ink: #06130E;
  --qibla: #E3A93F;
  --ok: #55D08E;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--ink);
  font: 400 16px/1.45 var(--font-body);
  margin: 0;
  padding-block: 20px 32px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
main { max-width: 460px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
h1 { font-size: 22px; line-height: 1.15; margin: 0; font-weight: 600; letter-spacing: -0.01em; text-wrap: balance; }
h2 { font: 600 12px/1.2 var(--font-body); text-transform: uppercase; letter-spacing: 0.09em; color: var(--muted); margin: 0 0 10px; }
.muted { color: var(--muted); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.head p { margin: 4px 0 0; font-size: 14px; min-width: 0; overflow-wrap: anywhere; }
.ar { font: 700 38px/1 var(--font-ar); color: var(--accent); }

.dial-card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 20px;
  padding: 16px 14px 20px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
}
#dial { width: 100%; max-width: 340px; height: auto; display: block; }
.pointer { fill: var(--ink); }
.ring { fill: var(--bg); stroke: var(--line); stroke-width: 2; }
.aligned .ring { stroke: var(--ok); stroke-width: 4; }
.tick { stroke: var(--muted); stroke-width: 1; opacity: 0.7; }
.tick.major { stroke: var(--ink); stroke-width: 2; opacity: 1; }
.lbl { font: 500 16px var(--font-num); fill: var(--ink); text-anchor: middle; dominant-baseline: central; paint-order: stroke; stroke: var(--bg); stroke-width: 5px; stroke-linejoin: round; }
.lbl.north { fill: var(--accent); font-weight: 500; }
.needle-line { stroke: var(--qibla); stroke-width: 4; stroke-linecap: round; }
.kaaba { fill: var(--qibla); }
.kaaba-band { fill: var(--surface); opacity: 0.7; }
.hub { fill: var(--ink); }

.readout { display: flex; flex-direction: column; align-items: center; gap: 6px; width: 100%; }
.deg { font: 500 56px/1 var(--font-num); letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.deg .unit { font-size: 28px; color: var(--muted); margin-left: 2px; }
.dir { font-size: 16px; color: var(--muted); text-align: center; }
.status { margin: 6px 0 4px; min-height: 2.9em; text-align: center; font-size: 15px; max-width: 34ch; text-wrap: balance; }
.aligned .status-wrap { color: var(--ok); }

.btn {
  font: 500 15px/1 var(--font-body);
  min-height: 44px;
  padding: 0 18px;
  border-radius: 12px;
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--ink);
  cursor: pointer;
}
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.btn:focus-visible, select:focus-visible, input:focus-visible, summary:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

.clocks { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
.clock { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px; min-width: 0; }
.clock .time { font: 500 30px/1 var(--font-num); font-variant-numeric: tabular-nums; white-space: nowrap; }
.clock .ss { font-size: 18px; color: var(--muted); }
.clock .date { margin: 8px 0 0; font-size: 14px; }
.clock .tz { margin: 2px 0 0; font: 400 12px var(--font-num); color: var(--muted); }
.diff { grid-column: 1 / -1; margin: 0; font-size: 14px; color: var(--muted); }

.place { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px; }
.place .row { display: flex; flex-wrap: wrap; gap: 10px; }
select, input[type="number"] {
  font: 400 16px var(--font-body);
  min-height: 44px;
  border-radius: 12px;
  border: 1px solid var(--line);
  background: var(--bg);
  color: var(--ink);
  padding: 0 12px;
}
select { flex: 1; min-width: 150px; }
summary { cursor: pointer; min-height: 44px; display: flex; align-items: center; font-size: 15px; color: var(--accent); margin-top: 6px; }
.coords { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; align-items: end; padding-bottom: 4px; }
.coords label { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--muted); min-width: 0; }
.coords input { width: 100%; min-width: 0; }
.coords .btn { grid-column: 1 / -1; }
#geoMsg { margin: 8px 0 0; font-size: 14px; min-height: 1.4em; }
.foot { margin: 0; font-size: 12px; color: var(--muted); text-wrap: balance; }
</style>

<main>
  <header class="head">
    <div>
      <h1>Boussole Qibla</h1>
      <p class="muted" id="where">Paris</p>
    </div>
    <span class="ar" lang="ar" dir="rtl">القبلة</span>
  </header>

  <section class="dial-card" id="card" aria-label="Boussole">
    <svg id="dial" viewBox="0 -24 360 384" role="img" aria-label="Boussole indiquant la direction de la Qibla">
      <polygon class="pointer" points="169,-18 191,-18 180,6"/>
      <g id="rose">
        <circle class="ring" cx="180" cy="180" r="168"/>
        <g id="ticks"></g>
        <g id="labels"></g>
        <g id="needle">
          <line class="needle-line" x1="180" y1="146" x2="180" y2="40"/>
          <rect class="kaaba" x="167" y="0" width="26" height="26" rx="4"/>
          <rect class="kaaba-band" x="167" y="7" width="26" height="4"/>
        </g>
      </g>
      <circle class="hub" cx="180" cy="180" r="7"/>
    </svg>
    <div class="readout">
      <div class="deg"><span id="deg">--</span><span class="unit">°</span></div>
      <div class="dir"><span id="cardinal"></span> · <span id="dist"></span></div>
      <p class="status status-wrap" id="status" role="status"></p>
      <button class="btn primary" id="start" type="button">Activer la boussole</button>
    </div>
  </section>

  <section class="clocks" aria-label="Heures">
    <article class="clock">
      <h2>La Mecque</h2>
      <div class="time"><span id="hm-mecca">--:--</span><span class="ss" id="ss-mecca"></span></div>
      <p class="date" id="date-mecca"></p>
      <p class="tz" id="tz-mecca"></p>
    </article>
    <article class="clock">
      <h2>France</h2>
      <div class="time"><span id="hm-fr">--:--</span><span class="ss" id="ss-fr"></span></div>
      <p class="date" id="date-fr"></p>
      <p class="tz" id="tz-fr"></p>
    </article>
    <p class="diff" id="diff"></p>
  </section>

  <section class="place" aria-label="Position">
    <h2>Votre position</h2>
    <div class="row">
      <button class="btn" id="geo" type="button">Utiliser ma position</button>
      <label class="sr" for="city">Ville</label>
      <select id="city"></select>
    </div>
    <details>
      <summary>Saisir des coordonnées</summary>
      <div class="coords">
        <label for="lat">Latitude
          <input id="lat" type="number" step="any" inputmode="decimal" placeholder="48,8566">
        </label>
        <label for="lon">Longitude
          <input id="lon" type="number" step="any" inputmode="decimal" placeholder="2,3522">
        </label>
        <button class="btn" id="apply" type="button">Appliquer</button>
      </div>
    </details>
    <p class="muted" id="geoMsg" role="status"></p>
  </section>

  <p class="foot">Direction par le grand cercle vers la Kaaba (21,4225° N, 39,8262° E). Tout est calculé sur l’appareil, rien n’est envoyé.</p>
</main>

<script>
(function () {
  "use strict";
  var $ = function (id) { return document.getElementById(id); };
  var KAABA = { lat: 21.422487, lon: 39.826206 };
  var CITIES = [
    ["Paris", 48.8566, 2.3522], ["Lyon", 45.7640, 4.8357], ["Marseille", 43.2965, 5.3698],
    ["Toulouse", 43.6047, 1.4442], ["Nice", 43.7102, 7.2620], ["Nantes", 47.2184, -1.5536],
    ["Montpellier", 43.6108, 3.8767], ["Strasbourg", 48.5734, 7.7521], ["Bordeaux", 44.8378, -0.5792],
    ["Lille", 50.6292, 3.0573], ["Rennes", 48.1173, -1.6778], ["Reims", 49.2583, 4.0317],
    ["Saint-Étienne", 45.4397, 4.3872], ["Toulon", 43.1242, 5.9280], ["Grenoble", 45.1885, 5.7245],
    ["Dijon", 47.3220, 5.0415], ["Angers", 47.4784, -0.5632], ["Nîmes", 43.8367, 4.3601],
    ["Clermont-Ferrand", 45.7772, 3.0870], ["Le Havre", 49.4944, 0.1079]
  ].map(function (c) { return { name: c[0], lat: c[1], lon: c[2] }; });
  var WINDS = ["Nord", "Nord-Nord-Est", "Nord-Est", "Est-Nord-Est", "Est", "Est-Sud-Est", "Sud-Est", "Sud-Sud-Est",
    "Sud", "Sud-Sud-Ouest", "Sud-Ouest", "Ouest-Sud-Ouest", "Ouest", "Ouest-Nord-Ouest", "Nord-Ouest", "Nord-Nord-Ouest"];

  var rad = function (d) { return d * Math.PI / 180; };
  var deg = function (r) { return r * 180 / Math.PI; };
  var setText = function (el, t) { if (el.textContent !== t) el.textContent = t; };
  var comma = function (n, d) { return n.toFixed(d).replace(".", ","); };

  function qiblaBearing(lat, lon) {
    var p1 = rad(lat), p2 = rad(KAABA.lat), dl = rad(KAABA.lon - lon);
    var y = Math.sin(dl) * Math.cos(p2);
    var x = Math.cos(p1) * Math.sin(p2) - Math.sin(p1) * Math.cos(p2) * Math.cos(dl);
    return (deg(Math.atan2(y, x)) + 360) % 360;
  }
  function distanceKm(lat, lon) {
    var R = 6371.0088, p1 = rad(lat), p2 = rad(KAABA.lat), dp = p2 - p1, dl = rad(KAABA.lon - lon);
    var a = Math.pow(Math.sin(dp / 2), 2) + Math.cos(p1) * Math.cos(p2) * Math.pow(Math.sin(dl / 2), 2);
    return 2 * R * Math.asin(Math.sqrt(a));
  }
  function fmtCoord(lat, lon) {
    return comma(Math.abs(lat), 3) + "° " + (lat >= 0 ? "N" : "S") + ", " + comma(Math.abs(lon), 3) + "° " + (lon >= 0 ? "E" : "O");
  }

  /* ---------- Dial ---------- */
  var NS = "http://www.w3.org/2000/svg";
  function el(name, attrs) {
    var e = document.createElementNS(NS, name);
    for (var k in attrs) e.setAttribute(k, attrs[k]);
    return e;
  }
  var ticks = $("ticks");
  for (var i = 0; i < 72; i++) {
    var a = i * 5, major = a % 90 === 0, mid = a % 10 === 0;
    var len = major ? 16 : mid ? 10 : 5, r1 = 164, r2 = r1 - len, t = rad(a);
    ticks.appendChild(el("line", {
      x1: 180 + r1 * Math.sin(t), y1: 180 - r1 * Math.cos(t),
      x2: 180 + r2 * Math.sin(t), y2: 180 - r2 * Math.cos(t),
      "class": "tick" + (major ? " major" : "")
    }));
  }
  [["N", 0], ["E", 90], ["S", 180], ["O", 270]].forEach(function (c) {
    var t = rad(c[1]);
    var txt = el("text", { x: 180 + 132 * Math.sin(t), y: 180 - 132 * Math.cos(t), "class": "lbl" + (c[0] === "N" ? " north" : "") });
    txt.textContent = c[0];
    $("labels").appendChild(txt);
  });

  /* ---------- Place ---------- */
  var place = null, qibla = 0;
  var citySel = $("city");
  CITIES.forEach(function (c, i) {
    var o = document.createElement("option");
    o.value = String(i); o.textContent = c.name; citySel.appendChild(o);
  });
  var customOpt = document.createElement("option");
  customOpt.value = "custom"; customOpt.hidden = true; citySel.appendChild(customOpt);

  function setPlace(p, save) {
    place = p;
    qibla = qiblaBearing(p.lat, p.lon);
    var dist = Math.round(distanceKm(p.lat, p.lon) / 10) * 10;
    setText($("where"), p.custom ? p.name + " (" + fmtCoord(p.lat, p.lon) + ")" : p.name);
    setText($("deg"), String(Math.round(qibla) % 360));
    setText($("cardinal"), WINDS[Math.round(qibla / 22.5) % 16]);
    setText($("dist"), dist.toLocaleString("fr-FR") + " km");
    $("needle").setAttribute("transform", "rotate(" + qibla.toFixed(2) + " 180 180)");
    if (p.custom) {
      customOpt.textContent = p.name; customOpt.hidden = false; citySel.value = "custom";
    } else {
      var idx = CITIES.findIndex(function (c) { return c.name === p.name; });
      if (idx >= 0) citySel.value = String(idx);
    }
    if (save) { try { localStorage.setItem("qibla.place", JSON.stringify(p)); } catch (e) {} }
    renderStatus();
  }

  /* ---------- Sensor ---------- */
  var heading = 0, shown = 0, sensor = false, started = false, timedOut = false, aligned = false, looping = false;
  function delta() { return ((qibla - shown + 540) % 360) - 180; }

  function renderStatus() {
    var t;
    if (sensor) {
      var d = delta();
      t = Math.abs(d) <= 3 ? "Vous faites face à la Qibla."
        : "Tournez de " + Math.round(Math.abs(d)) + "° vers la " + (d > 0 ? "droite" : "gauche") + ".";
    } else if (timedOut) {
      t = "Le capteur d’orientation n’est pas accessible ici. La flèche dorée indique la Qibla : " +
        Math.round(qibla) + "° dans le sens des aiguilles d’une montre à partir du nord.";
    } else if (started) {
      t = "Recherche du capteur d’orientation…";
    } else {
      t = "Appuyez sur « Activer la boussole », puis tenez le téléphone à plat.";
    }
    setText($("status"), t);
  }

  function tiltHeading(alpha, beta, gamma) {
    var x = rad(beta), y = rad(gamma), z = rad(alpha);
    var cY = Math.cos(y), cZ = Math.cos(z), sX = Math.sin(x), sY = Math.sin(y), sZ = Math.sin(z);
    var vx = -cZ * sY - sZ * sX * cY;
    var vy = -sZ * sY + cZ * sX * cY;
    var h = Math.atan2(vx, vy);
    if (h < 0) h += 2 * Math.PI;
    return deg(h);
  }

  function onOrient(e) {
    var h = null;
    if (typeof e.webkitCompassHeading === "number" && !isNaN(e.webkitCompassHeading)) {
      h = e.webkitCompassHeading;
    } else if (e.alpha != null && (e.type === "deviceorientationabsolute" || e.absolute === true)) {
      h = tiltHeading(e.alpha, e.beta || 0, e.gamma || 0);
    }
    if (h == null) return;
    heading = (h + 360) % 360;
    if (!sensor) {
      sensor = true; shown = heading; timedOut = false;
      $("start").hidden = true;
      if (!looping) { looping = true; requestAnimationFrame(frame); }
    }
  }

  function frame() {
    var d = ((heading - shown + 540) % 360) - 180;
    if (Math.abs(d) > 0.05) shown = (shown + d * 0.18 + 360) % 360;
    $("rose").setAttribute("transform", "rotate(" + (-shown).toFixed(2) + " 180 180)");
    var now = Math.abs(delta()) <= 3;
    if (now !== aligned) {
      aligned = now;
      $("card").classList.toggle("aligned", aligned);
      if (aligned) { try { if (navigator.vibrate) navigator.vibrate(30); } catch (e) {} }
    }
    renderStatus();
    requestAnimationFrame(frame);
  }

  function startSensors() {
    started = true; timedOut = false; renderStatus();
    var D = window.DeviceOrientationEvent;
    var go = function () {
      window.addEventListener("deviceorientationabsolute", onOrient, true);
      window.addEventListener("deviceorientation", onOrient, true);
      setTimeout(function () {
        if (!sensor) { timedOut = true; started = false; $("start").textContent = "Réessayer"; renderStatus(); }
      }, 2500);
    };
    if (!D) { timedOut = true; started = false; renderStatus(); return; }
    if (typeof D.requestPermission === "function") {
      D.requestPermission().then(function (r) {
        if (r === "granted") go();
        else { timedOut = true; started = false; renderStatus(); }
      }).catch(function () { timedOut = true; started = false; renderStatus(); });
    } else {
      go();
    }
  }
  $("start").addEventListener("click", startSensors);

  /* ---------- Location controls ---------- */
  function msg(t) { setText($("geoMsg"), t); }
  $("geo").addEventListener("click", function () {
    if (!navigator.geolocation) { msg("Position indisponible sur cet appareil. Choisissez une ville ou saisissez des coordonnées."); return; }
    msg("Recherche de votre position…");
    navigator.geolocation.getCurrentPosition(function (pos) {
      setPlace({ name: "Ma position", lat: pos.coords.latitude, lon: pos.coords.longitude, custom: true }, true);
      msg("Position mise à jour.");
    }, function (err) {
      msg(err && err.code === 1
        ? "Accès à la position refusé. Choisissez une ville ou saisissez des coordonnées."
        : "Position introuvable. Choisissez une ville ou saisissez des coordonnées.");
    }, { enableHighAccuracy: false, timeout: 10000, maximumAge: 600000 });
  });
  citySel.addEventListener("change", function () {
    if (citySel.value === "custom") return;
    setPlace(CITIES[Number(citySel.value)], true); msg("");
  });
  $("apply").addEventListener("click", function () {
    var lat = parseFloat($("lat").value), lon = parseFloat($("lon").value);
    if (!isFinite(lat) || !isFinite(lon) || lat < -90 || lat > 90 || lon < -180 || lon > 180) {
      msg("Coordonnées invalides : latitude entre -90 et 90, longitude entre -180 et 180."); return;
    }
    setPlace({ name: "Coordonnées saisies", lat: lat, lon: lon, custom: true }, true);
    msg("Position mise à jour.");
  });

  /* ---------- Clocks ---------- */
  var ZONES = { mecca: "Asia/Riyadh", fr: "Europe/Paris" };
  var TF = {}, DF = {}, PF = {};
  Object.keys(ZONES).forEach(function (k) {
    TF[k] = new Intl.DateTimeFormat("fr-FR", { timeZone: ZONES[k], hour: "2-digit", minute: "2-digit", second: "2-digit", hourCycle: "h23" });
    DF[k] = new Intl.DateTimeFormat("fr-FR", { timeZone: ZONES[k], weekday: "long", day: "numeric", month: "long" });
    PF[k] = new Intl.DateTimeFormat("en-US", { timeZone: ZONES[k], hourCycle: "h23", year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit", second: "2-digit" });
  });
  function offsetMin(k, d) {
    var p = {};
    PF[k].formatToParts(d).forEach(function (x) { if (x.type !== "literal") p[x.type] = Number(x.value); });
    return (Date.UTC(p.year, p.month - 1, p.day, p.hour, p.minute, p.second) - Math.floor(d.getTime() / 1000) * 1000) / 60000;
  }
  function offLabel(min) {
    var a = Math.abs(min), h = Math.floor(a / 60), m = a % 60;
    return "UTC" + (min < 0 ? "−" : "+") + h + (m ? ":" + String(m).padStart(2, "0") : "");
  }
  function cap(s) { return s.charAt(0).toUpperCase() + s.slice(1); }

  function tickClocks() {
    var now = new Date(), off = {};
    Object.keys(ZONES).forEach(function (k) {
      var parts = TF[k].format(now).split(":");
      setText($("hm-" + k), parts[0] + ":" + parts[1]);
      setText($("ss-" + k), ":" + parts[2]);
      setText($("date-" + k), cap(DF[k].format(now)));
      off[k] = offsetMin(k, now);
    });
    setText($("tz-mecca"), offLabel(off.mecca));
    setText($("tz-fr"), offLabel(off.fr) + (off.fr === 120 ? " · heure d’été" : off.fr === 60 ? " · heure d’hiver" : ""));
    var dm = off.mecca - off.fr, h = Math.abs(dm) / 60;
    var hs = h.toLocaleString("fr-FR") + " h";
    setText($("diff"), dm === 0 ? "La Mecque et la France ont la même heure."
      : "La Mecque a " + hs + (dm > 0 ? " d’avance" : " de retard") + " sur la France.");
  }
  tickClocks();
  setInterval(tickClocks, 1000);

  /* ---------- Start ---------- */
  var initial = CITIES[0];
  try {
    var s = JSON.parse(localStorage.getItem("qibla.place") || "null");
    if (s && isFinite(s.lat) && isFinite(s.lon) && s.name) initial = s;
  } catch (e) {}
  setPlace(initial, false);
})();
